<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User - USOS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h2>Edytuj użytkownika</h2>
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">Nazwa użytkownika</label>
                        <input type="text" class="form-control" id="username" name="username" value="{{ user.username }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="full_name" class="form-label">Pełne imię i nazwisko</label>
                        <input type="text" class="form-control" id="full_name" name="full_name" value="{{ user.full_name }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="role" class="form-label">Rola</label>
                        <select class="form-control" id="role" name="role" required>
                            <option value="student" {% if user.role == 'student' %}selected{% endif %}>Student</option>
                            <option value="teacher" {% if user.role == 'teacher' %}selected{% endif %}>Wykładowca</option>
                            <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Administrator</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Nowe hasło (pozostaw puste, aby zachować obecne)</label>
                        <input type="password" class="form-control" id="password" name="password">
                    </div>
                    <button type="submit" class="btn btn-primary">Aktualizuj użytkownika</button>
                    <a href="{{ url_for('admin.dashboard') }}" class="btn btn-secondary">Anuluj</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
