<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - USOS Wykładowca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" href="#">USOS Teacher</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{{ url_for('teacher.dashboard') }}">Dashboard</a>
                <a class="nav-link" href="{{ url_for('teacher.messages') }}">Wiadomości</a>
                <a class="nav-link" href="{{ url_for('logout') }}">Wyloguj się</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="card">
            <div class="card-header">
                <h3>Chat z {{ other_user.full_name }}</h3>
                <small class="text-muted">{{ other_user.email }}</small>
            </div>
            <div class="card-body" style="height: 400px; overflow-y: auto;" id="chat-messages">
                {% for message in messages %}
                    <div class="mb-3 {% if message.sender_id == current_user.id %}text-end{% endif %}">
                        <div class="d-inline-block p-2 rounded {% if message.sender_id == current_user.id %}bg-primary text-white{% else %}bg-light{% endif %}">
                            {{ message.content }}
                            <div class="small {% if message.sender_id == current_user.id %}text-white-50{% else %}text-muted{% endif %}">
                                {{ message.created_at.strftime('%Y-%m-%d %H:%M') }}
                            </div>
                        </div>
                    </div>
                {% endfor %}
            </div>
            <div class="card-footer">
                <form method="POST" class="d-flex">
                    <input type="text" name="message" class="form-control me-2" placeholder="Wpisz swoją wiadomość..." required>
                    <button type="submit" class="btn btn-primary">Wyślij</button>
                </form>
            </div>
        </div>
        <div class="mt-3">
            <a href="{{ url_for('teacher.messages') }}" class="btn btn-secondary">Powrót do Wiadomości</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Автопрокрутка к последнему сообщению
        const chatMessages = document.getElementById('chat-messages');
        chatMessages.scrollTop = chatMessages.scrollHeight;
    </script>
</body>
</html>
