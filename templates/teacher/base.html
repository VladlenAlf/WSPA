<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Teacher Dashboard{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('teacher.dashboard') }}">USOS Teacher</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{{ url_for('teacher.dashboard') }}">Dashboard</a>
                <a class="nav-link" href="{{ url_for('teacher.messages') }}">
                    Messages
                    {% if unread_messages and unread_messages > 0 %}
                        <span class="badge bg-danger">{{ unread_messages }}</span>
                    {% endif %}
                </a>
                <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
