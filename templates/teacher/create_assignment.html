{% extends "admin/base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Create New Assignment for {{ course.name }}</h2>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    
    <div class="card">
        <div class="card-body">
            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="title" class="form-label">Title</label>
                    <input type="text" class="form-control" id="title" name="title" required>
                </div>
                
                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea class="form-control" id="description" name="description" rows="3" required></textarea>
                </div>
                
                <div class="mb-3">
                    <label for="assignment_file" class="form-label">Assignment File</label>
                    <input type="file" class="form-control" id="assignment_file" name="assignment_file">
                </div>
                
                <div class="mb-3">
                    <label for="due_date" class="form-label">Due Date</label>
                    <input type="datetime-local" class="form-control" id="due_date" name="due_date" required>
                </div>
                
                <button type="submit" class="btn btn-primary">Create Assignment</button>
                <a href="{{ url_for('teacher.manage_assignments', course_id=course.id) }}" 
                   class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
