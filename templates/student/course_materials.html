<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Materials - USOS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('student.dashboard') }}">USOS Student</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{{ url_for('student.view_grades') }}">My Grades</a>
                <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>{{ course.name }} - Materials</h2>

        <div class="row mt-4">
            {% for material in materials %}
            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">{{ material.title }}</h5>
                        <p class="card-text">{{ material.description }}</p>
                        {% if material.file_path %}
                            <a href="{{ url_for('student.download_material', material_id=material.id) }}" 
                               class="btn btn-primary">Download</a>
                        {% endif %}
                    </div>
                    <div class="card-footer text-muted">
                        Added: {{ material.uploaded_at.strftime('%Y-%m-%d') }}
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
