{% extends "student/base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h3>Chat with {{ other_user.full_name }}</h3>
        </div>
        <div class="card-body" style="height: 400px; overflow-y: auto;">
            {% for message in messages %}
            <div class="mb-3 {% if message.sender_id == current_user.id %}text-end{% endif %}">
                <div class="d-inline-block p-2 rounded {% if message.sender_id == current_user.id %}bg-primary text-white{% else %}bg-light{% endif %}">
                    {{ message.content }}
                </div>
                <div class="small text-muted">
                    {{ message.created_at.strftime('%Y-%m-%d %H:%M') }}
                </div>
            </div>
            {% endfor %}
        </div>
        <div class="card-footer">
            <form method="POST">
                <div class="input-group">
                    <input type="text" class="form-control" name="message" placeholder="Type your message..." required>
                    <button type="submit" class="btn btn-primary">Send</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
